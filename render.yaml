databases:
  - name: urban-legend-db
    plan: free
    databaseName: urban_legend

services:
  - type: web
    name: urban-legend-api
    runtime: python
    pythonVersion: "3.11.4"
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urban-legend-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: YELP_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

